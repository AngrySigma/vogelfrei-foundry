<form class="ose roll-dialog">
    {{#if data.rollData.details}}
    <div class="roll-details">
        {{data.rollData.details}}
    </div>
    {{/if}}
    <div class="form-group">
        <label>{{localize "VF.Formula"}}</label>
        <input type="text" name="formula" value="{{formula}}" disabled />
    </div>
    <div class="form-group">
        <label>{{localize "VF.SitMod"}}</label>
        <input type="text" name="bonus" value="" placeholder="{{localize 'VF.RollExample'}}" />
    </div>
    <div class="form-group">
        <label>{{localize "VF.RollMode"}}</label>
        <select name="rollMode">
            {{selectOptions rollModes selected=rollMode labelAttr="label" localize=true}}
        </select>
    </div>
</form>
