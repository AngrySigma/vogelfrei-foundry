name: Release Creation

on:
  push:
    tags:
      - "*"

# ncipollo/release-action creates the Release, which GITHUB_TOKEN cannot do
# under the read-only default that newer repositories ship with.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository to add to workspace
        uses: actions/checkout@v4

      - name: Setup Node.js version 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Insert release-specific values into system.json.
      # `manifest` deliberately points at releases/latest so that installed
      # copies can see future updates; `download` is pinned to this tag.
      - name: Insert release-specific values in manifest file
        uses: microsoft/variable-substitution@v1
        with:
          files: "system.json"
        env:
          id: vogelfrei
          title: "Vogelfrei"
          version: ${{github.ref_name}}
          url: https://github.com/${{github.repository}}
          manifest: https://github.com/${{github.repository}}/releases/latest/download/system.json
          download: https://github.com/${{github.repository}}/releases/download/${{github.ref_name}}/system.zip

      # The zip's root must contain system.json for Foundry to install it.
      - name: Create zip file
        run: |
          zip -r ./system.zip \
            system.json \
            template.json \
            dist/ \
            assets/ \
            LICENSE.GPL \
            LICENSE.OGL \
            LICENSE.OTHER.OSE_THIRD_PARTY_V1_5 \
            NOTICE \
            AUTHORS

      # Creates the Release as well as attaching to it, so pushing a tag is the
      # single action that publishes. Triggering on `release: published` meant a
      # tag alone did nothing and the manifest URL 404'd.
      - name: Publish release with assets
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./system.json, ./system.zip"
          tag: ${{ github.ref_name }}
          generateReleaseNotes: true
