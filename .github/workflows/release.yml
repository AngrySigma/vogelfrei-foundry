name: Release Creation

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository to add to workspace
        uses: actions/checkout@v4

      - name: Setup Node.js version 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Insert release-specific values into system.json.
      # `manifest` deliberately points at releases/latest so that installed
      # copies can see future updates; `download` is pinned to this tag.
      - name: Insert release-specific values in manifest file
        uses: microsoft/variable-substitution@v1
        with:
          files: "system.json"
        env:
          id: vogelfrei
          title: "Vogelfrei"
          version: ${{github.event.release.tag_name}}
          url: https://github.com/${{github.repository}}
          manifest: https://github.com/${{github.repository}}/releases/latest/download/system.json
          download: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/system.zip

      # The zip's root must contain system.json for Foundry to install it.
      - name: Create zip file
        run: |
          zip -r ./system.zip \
            system.json \
            template.json \
            dist/ \
            assets/ \
            LICENSE.GPL \
            LICENSE.OGL \
            LICENSE.OTHER.OSE_THIRD_PARTY_V1_5 \
            NOTICE \
            AUTHORS

      - name: Update Release with Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./system.json, ./system.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
